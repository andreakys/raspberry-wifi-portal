<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }} - Accesso</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <main class="page-shell login-shell">
      <section class="hero-card login-card">
        {% include "_brand.html" %}
        <div class="topbar">
          <div>
            <p class="eyebrow">Accesso protetto</p>
            <span class="version-badge">Versione {{ app_version }}</span>
          </div>
        </div>
        <h1>{{ page_title }}</h1>
        <p class="lead">
          Accedi per gestire hotspot, Wi-Fi client, LAN cablata e indirizzi IP del tuo Display.
        </p>

        {% if error_message %}
        <div class="message error">{{ error_message }}</div>
        {% endif %}

        <form method="post" action="/login" class="setup-form">
          <input type="hidden" name="next" value="{{ next_url }}">
          <label>
            <span>Password portale</span>
            <div class="password-field">
              <input type="password" name="portal_password" id="portal-password" placeholder="Password amministratore" autocomplete="current-password" required autofocus>
              <button type="button" class="password-toggle" data-password-toggle="portal-password">Mostra</button>
            </div>
          </label>
          <button type="submit" class="primary-button">Entra</button>
        </form>
      </section>
    </main>
    <script>
      document.querySelectorAll("[data-password-toggle]").forEach((button) => {
        button.addEventListener("click", () => {
          const input = document.getElementById(button.dataset.passwordToggle);
          const visible = input.type === "text";
          input.type = visible ? "password" : "text";
          button.textContent = visible ? "Mostra" : "Nascondi";
        });
      });
    </script>
  </body>
</html>
