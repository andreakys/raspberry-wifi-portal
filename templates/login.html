<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }} - Accesso</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <main class="page-shell login-shell">
      <section class="hero-card login-card">
        <div class="topbar">
          <div>
            <p class="eyebrow">Accesso protetto</p>
            <span class="version-badge">Versione {{ app_version }}</span>
          </div>
        </div>
        <h1>{{ page_title }}</h1>
        <p class="lead">
          Inserisci la password del portale per modificare Wi-Fi, hotspot e indirizzi IP.
        </p>

        {% if error_message %}
        <div class="message error">{{ error_message }}</div>
        {% endif %}

        <form method="post" action="/login" class="setup-form">
          <input type="hidden" name="next" value="{{ next_url }}">
          <label>
            <span>Password portale</span>
            <input type="password" name="portal_password" placeholder="Password amministratore" autocomplete="current-password" required autofocus>
          </label>
          <button type="submit" class="primary-button">Entra</button>
        </form>
      </section>
    </main>
  </body>
</html>
